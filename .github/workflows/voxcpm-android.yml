name: VoxCPM Studio APK

on:
  push:
    paths:
      - "voxcpm-app/android/**"
      - ".github/workflows/voxcpm-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxcpm-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoxCPMStudio-apk
          path: voxcpm-app/android/app/build/outputs/apk/release/*.apk
